<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
  <meta charset="UTF-8"/>
  <title>Agendamentos</title>
</h:head>
<h:body>
  <h:form id="form">
    <p:growl id="growl" showDetail="true"/>

    <p:button value="Voltar"
              outcome="/index.xhtml"
              icon="pi pi-home"
              style="margin-bottom:15px"/>

    <p:panel id="painelAgendamento"
             header="Novo Agendamento">

      <p:outputLabel value="Cliente" for="cliente"/>
      <p:selectOneMenu id="cliente"
                       value="#{agendamentoController.agendamento.cliente}"
                       required="true" style="width:300px"
                       converter="omnifaces.SelectItemsConverter">
        <f:selectItem itemLabel="Selecione..." itemValue=""/>
        <f:selectItems value="#{agendamentoController.clientes}"
                       var="c" itemLabel="#{c.nome}" itemValue="#{c}"/>
      </p:selectOneMenu>
      <br/><br/>

      <p:outputLabel value="Barbeiro" for="barbeiro"/>
      <p:selectOneMenu id="barbeiro"
                       value="#{agendamentoController.agendamento.barbeiro}"
                       required="true" style="width:300px"
                       converter="omnifaces.SelectItemsConverter">
        <f:selectItem itemLabel="Selecione..." itemValue=""/>
        <f:selectItems value="#{agendamentoController.barbeiros}"
                       var="b" itemLabel="#{b.nome}" itemValue="#{b}"/>
      </p:selectOneMenu>
      <br/><br/>

      <p:outputLabel value="Serviço" for="servico"/>
      <p:selectOneMenu id="servico"
                       value="#{agendamentoController.agendamento.servico}"
                       required="true" style="width:300px"
                       converter="omnifaces.SelectItemsConverter">
        <f:selectItem itemLabel="Selecione..." itemValue=""/>
        <f:selectItems value="#{agendamentoController.servicos}"
                       var="s"
                       itemLabel="#{s.nome} - R$ #{s.preco}"
                       itemValue="#{s}"/>
      </p:selectOneMenu>
      <br/><br/>

      <p:outputLabel value="Data e Hora" for="dataHora"/>
      <p:datePicker id="dataHora"
                    value="#{agendamentoController.agendamento.dataHora}"
                    pattern="dd/MM/yyyy HH:mm"
                    showTime="true"
                    hourFormat="24"
                    minDate="#{agendamentoController.hoje}"
                    required="true"
                    style="width:300px"/>
      <br/><br/>

      <p:commandButton value="#{agendamentoController.update ? 'Atualizar' : 'Agendar'}"
                       action="#{agendamentoController.salvar}"
                       update="form growl"
                       process="@form"
                       ajax="true"
                       icon="pi pi-calendar"/>

      <p:commandButton value="Cancelar"
                       action="#{agendamentoController.cancelar}"
                       update=":form"
                       process="@this"
                       icon="pi pi-times"
                       rendered="#{agendamentoController.update}"
                       style="margin-left:10px"/>
    </p:panel>

    <br/>

    <p:dataTable value="#{agendamentoController.agendamentos}"
                 id="tabelaAgendamentos"
                 var="a"
                 paginator="true"
                 rows="10"
                 emptyMessage="Nenhum agendamento encontrado">

      <p:column headerText="Cliente">#{a.cliente.nome}</p:column>
      <p:column headerText="Barbeiro">#{a.barbeiro.nome}</p:column>
      <p:column headerText="Serviço">#{a.servico.nome}</p:column>
      <p:column headerText="Data/Hora">
        <h:outputText value="#{a.dataHora}">
          <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm"/>
        </h:outputText>
      </p:column>
      <p:column headerText="Status">#{a.status}</p:column>

      <p:column headerText="Ações">
        <p:commandButton icon="pi pi-pencil"
                         action="#{agendamentoController.editar(a)}"
                         process="@this"
                         immediate="true"
                         update=":form:painelAgendamento"/>

        <p:commandButton icon="pi pi-trash"
                         action="#{agendamentoController.excluir(a)}"
                         update=":form:msgs :form:tabelaAgendamentos"
                         process="@this"
                         style="margin-left:5px">
          <p:confirm header="Confirmação"
                     message="Deseja cancelar este agendamento?"/>
        </p:commandButton>
      </p:column>
    </p:dataTable>

    <p:confirmDialog global="true">
      <p:commandButton value="Sim" type="button"
                       styleClass="ui-confirmdialog-yes"/>
      <p:commandButton value="Não" type="button"
                       styleClass="ui-confirmdialog-no"/>
    </p:confirmDialog>

  </h:form>
</h:body>
</html>
