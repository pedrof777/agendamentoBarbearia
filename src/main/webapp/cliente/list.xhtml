<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
  <meta charset="UTF-8"/>
  <title>Clientes</title>
</h:head>
<h:body>
  <h:form id="form">
    <p:growl id="growl" showDetail="true" life="4000"/>

    <p:button value="Voltar"
              outcome="/index.xhtml"
              icon="pi pi-home"
              style="margin-bottom:15px"/>

    <p:panel id="painelCadastro"
            header="Cadastro de Cliente">
      <p:outputLabel value="Nome" for="nome"/>
      <p:inputText id="nome" value="#{clienteController.cliente.nome}"
                   required="true" style="width:300px"/>
      <br/><br/>

      <p:outputLabel value="Telefone" for="telefone"/>
      <p:inputMask id="telefone"
                   value="#{clienteController.cliente.telefone}"
                   mask="(99) 99999-9999"
                   required="true" style="width:300px"/>
      <br/><br/>

      <p:outputLabel value="Email" for="email"/>
      <p:inputText id="email" value="#{clienteController.cliente.email}"
                   style="width:300px"/>
      <br/><br/>

      <p:commandButton value="#{clienteController.update ? 'Atualizar' : 'Salvar'}"
                       actionListener="#{clienteController.salvar}"
                       update="form growl"
                       process="@form"
                       ajax="true"
                       icon="pi pi-save"                       />


      <p:commandButton value="Cancelar"
                       action="#{clienteController.cancelar}"
                       update=":form"
                        process="@this"
                       icon="pi pi-times"
                       rendered="#{clienteController.update}"
                       style="margin-left:10px"/>
    </p:panel>

    <br/>

    <p:dataTable value="#{clienteController.clientes}"
                  id="tabelaClientes"
                 var="c"
                 paginator="true" rows="10"
                 emptyMessage="Nenhum cliente cadastrado">

      <p:column headerText="Nome">#{c.nome}</p:column>
      <p:column headerText="Telefone">#{c.telefone}</p:column>
      <p:column headerText="Email">#{c.email}</p:column>

      <p:column headerText="Ações">
        <p:commandButton icon="pi pi-pencil"
                         action="#{clienteController.editar(c)}"
                         update=":form:painelCadastro"
                         process="@this"/>

        <p:commandButton icon="pi pi-trash"
                         action="#{clienteController.excluir(c)}"
                         update=":form:msgs :form:tabelaClientes"
                          process="@this"
                         style="margin-left:5px">
          <p:confirm header="Confirmação"
                     message="Deseja excluir este cliente?"/>
        </p:commandButton>
      </p:column>
    </p:dataTable>

    <p:confirmDialog global="true">
      <p:commandButton value="Sim" type="button"
                       styleClass="ui-confirmdialog-yes"/>
      <p:commandButton value="Não" type="button"
                       styleClass="ui-confirmdialog-no"/>
    </p:confirmDialog>

  </h:form>
</h:body>
</html>
